apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: premiumshopy
  labels: { app: web }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      imagePullSecrets: [{ name: ghcr }]
      securityContext: { runAsNonRoot: true, runAsUser: 1001, fsGroup: 1001 }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: web } }
      containers:
        - name: web
          image: ghcr.io/OWNER/premiumshopy-web:latest # replaced by CI with the commit SHA tag
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: web-config }
            - secretRef: { name: web-secrets }
          readinessProbe:
            httpGet: { path: /api/health?ready=1, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: uploads, mountPath: /app/storage/uploads }
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: uploads }
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: premiumshopy
spec:
  selector: { app: web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
# Load-based autoscaling: 2 → 10 pods
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: premiumshopy
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: premiumshopy
spec:
  minAvailable: 1
  selector: { matchLabels: { app: web } }
