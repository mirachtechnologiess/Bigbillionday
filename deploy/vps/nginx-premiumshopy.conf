# nginx site for PremiumShopy on the shared AceCloud server → /etc/nginx/sites-available/premiumshopy
# The Docker stack publishes the Next.js app on 127.0.0.1:3600 only.
# HTTPS: `sudo certbot --nginx -d premiumshopy.com -d www.premiumshopy.com -d admin.premiumshopy.com`
# adds the 443 listeners and http→https redirects to this file in place (certs auto-renew).

# www → apex
server {
    listen 80;
    listen [::]:80;
    server_name www.premiumshopy.com;
    return 301 https://premiumshopy.com$request_uri;
}

# Storefront (premiumshopy.com) and admin panel (admin.premiumshopy.com) — same app;
# the app's middleware serves /admin/* at clean paths on the admin host.
server {
    listen 80;
    listen [::]:80;
    server_name premiumshopy.com admin.premiumshopy.com;

    # Product photo uploads from the admin panel (10 MB each, several per request)
    client_max_body_size 40m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location / {
        proxy_pass http://127.0.0.1:3600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append) so clients cannot spoof their IP past the login rate limiter
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # AI product-from-photo can take ~30-60 s
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
