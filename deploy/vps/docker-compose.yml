# Production stack for a single small VPS (Namecheap "Spark": 1 vCPU · 1 GB RAM · 20 GB SSD).
# Lives at /opt/bigbillionday on the server next to .env and Caddyfile; CI copies this file there
# and runs:  docker compose pull && docker compose run --rm migrate && docker compose up -d
#
# Images are built by GitHub Actions (never on the server — `next build` needs >1 GB RAM).
# Memory budget (≈1 GB RAM + 2 GB swap): web 640 MB · db 300 MB · caddy 96 MB.
name: bigbillionday

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bbd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bigbillionday
    # Tuned for ~300 MB: small shared buffers, few connections (Prisma pool is capped at 5).
    command: >
      postgres
      -c shared_buffers=96MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=30
      -c wal_buffers=4MB
    shm_size: 128mb
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbd -d bigbillionday"]
      interval: 10s
      retries: 10
    mem_limit: 300m
    logging: *logging

  # One-shot: DB migrations + admin/brand seed (and catalog import on demand). Not a long-running service.
  migrate:
    image: ${MIGRATOR_IMAGE:-ghcr.io/mirachtechnologiess/bigbillionday-migrator}:${TAG:-latest}
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bbd:${POSTGRES_PASSWORD}@db:5432/bigbillionday?schema=public
      RUN_SEED: "true"
      SEED_DEMO: "false"
      UPLOAD_DIR: /app/storage/uploads
    volumes: [uploads:/app/storage/uploads]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 512m
    logging: *logging

  web:
    image: ${WEB_IMAGE:-ghcr.io/mirachtechnologiess/bigbillionday-web}:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bbd:${POSTGRES_PASSWORD}@db:5432/bigbillionday?schema=public&connection_limit=5
      UPLOAD_DIR: /app/storage/uploads
      NODE_ENV: production
      # Keep V8 heap well inside the container limit so Node GCs before the kernel OOM-kills it.
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - uploads:/app/storage/uploads
      - nextcache:/app/.next/cache
    depends_on:
      db: { condition: service_healthy }
    expose: ["3000"]
    mem_limit: 640m
    logging: *logging

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    mem_limit: 96m
    logging: *logging

volumes:
  pgdata:
  uploads:
  nextcache:
  caddy_data:
  caddy_config:
