name: CI / CD

# Push to main → lint + build → Docker images to GHCR → deploy to the VPS with Docker Compose.
# The VPS never builds anything (1 GB RAM is not enough for `next build`); it only pulls images.
#
# Repo secrets (Settings → Secrets and variables → Actions) — printed by deploy/vps/setup.sh:
#   VPS_HOST      server IP
#   VPS_USER      deploy
#   VPS_SSH_KEY   private key of the deploy user
#   VPS_PORT      optional, default 22
# Until VPS_HOST is set the deploy job is skipped (CI + images still run).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: /opt/bigbillionday

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma validate
        env: { DATABASE_URL: "postgresql://x:y@localhost:5432/z" }
      - run: npx next lint
      - run: npm run build
        env:
          DATABASE_URL: "postgresql://build:build@localhost:5432/build"
          NEXT_PUBLIC_SITE_URL: https://bigbillionday.store

  images:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      web: ${{ steps.names.outputs.web }}
      migrator: ${{ steps.names.outputs.migrator }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "web=ghcr.io/${owner}/bigbillionday-web" >> "$GITHUB_OUTPUT"
          echo "migrator=ghcr.io/${owner}/bigbillionday-migrator" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://bigbillionday.store
            NEXT_PUBLIC_ADMIN_HOST=admin.bigbillionday.store
            NEXT_PUBLIC_STORE_ORIGIN=https://bigbillionday.store
          tags: ${{ steps.names.outputs.web }}:${{ github.sha }},${{ steps.names.outputs.web }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ steps.names.outputs.migrator }}:${{ github.sha }},${{ steps.names.outputs.migrator }}:latest
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_VPS: ${{ secrets.VPS_HOST != '' }}
    steps:
      - name: VPS not configured yet
        if: env.HAS_VPS != 'true'
        run: echo "::notice::VPS_HOST secret not set — skipping deploy. Run deploy/vps/setup.sh on the server and add the secrets it prints."

      - uses: actions/checkout@v4
        if: env.HAS_VPS == 'true'

      - name: SSH setup
        if: env.HAS_VPS == 'true'
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName $HOST
            Port $PORT
            User ${{ secrets.VPS_USER || 'deploy' }}
            IdentityFile ~/.ssh/deploy_key
            ServerAliveInterval 30
          EOF

      - name: Upload compose + Caddy config
        if: env.HAS_VPS == 'true'
        run: scp deploy/vps/docker-compose.yml deploy/vps/Caddyfile vps:${APP_DIR}/

      - name: Pull images, migrate, restart
        if: env.HAS_VPS == 'true'
        env:
          WEB_IMAGE: ${{ needs.images.outputs.web }}
          MIGRATOR_IMAGE: ${{ needs.images.outputs.migrator }}
          TAG: ${{ github.sha }}
        run: |
          # Short-lived registry login (token piped via stdin, never on the command line)
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh vps "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh vps "cd ${APP_DIR} && export WEB_IMAGE=${WEB_IMAGE} MIGRATOR_IMAGE=${MIGRATOR_IMAGE} TAG=${TAG} && \
            docker compose --profile tools pull web migrate && \
            docker compose up -d db && \
            docker compose run --rm migrate && \
            docker compose up -d --remove-orphans web caddy && \
            { grep -vE '^(WEB_IMAGE|MIGRATOR_IMAGE|TAG)=' .env; printf 'WEB_IMAGE=%s\nMIGRATOR_IMAGE=%s\nTAG=%s\n' ${WEB_IMAGE} ${MIGRATOR_IMAGE} ${TAG}; } > .env.next && \
            mv .env.next .env && chmod 600 .env && \
            docker image prune -f >/dev/null; \
            docker logout ghcr.io >/dev/null"

      - name: Health check
        if: env.HAS_VPS == 'true'
        run: |
          for i in $(seq 1 30); do
            if ssh vps "cd ${APP_DIR} && docker compose exec -T web wget -qO- 'http://127.0.0.1:3000/api/health?ready=1'"; then
              echo; echo "✓ Healthy"; exit 0
            fi
            sleep 4
          done
          ssh vps "cd ${APP_DIR} && docker compose logs --tail=80 web"
          exit 1
