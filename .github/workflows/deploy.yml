name: CI / CD

# Push to main → lint + build → Docker images to GHCR → migrate DB → rolling deploy to Kubernetes.
# Required repo secrets:
#   KUBE_CONFIG  – base64 of a kubeconfig with access to the "premiumshopy" namespace
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/premiumshopy-web
  MIGRATOR_IMAGE: ghcr.io/${{ github.repository_owner }}/premiumshopy-migrator

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma validate
        env: { DATABASE_URL: "postgresql://x:y@localhost:5432/z" }
      - run: npx next lint
      - run: npm run build
        env:
          DATABASE_URL: "postgresql://build:build@localhost:5432/build"
          NEXT_PUBLIC_SITE_URL: https://bigbillionday.store

  images:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }},${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ env.MIGRATOR_IMAGE }}:${{ github.sha }},${{ env.MIGRATOR_IMAGE }}:latest
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
      - name: Apply base manifests
        run: |
          sed -i "s#ghcr.io/OWNER/#ghcr.io/${{ github.repository_owner }}/#g" k8s/*.yaml
          sed -i "s#premiumshopy-web:latest#premiumshopy-web:${{ github.sha }}#" k8s/20-web.yaml
          kubectl apply -f k8s/00-namespace-config.yaml -f k8s/10-postgres.yaml -f k8s/15-storage.yaml -f k8s/30-ingress.yaml
      - name: Migrate database
        run: |
          kubectl -n premiumshopy delete job db-migrate --ignore-not-found
          sed -i "s#premiumshopy-migrator:latest#premiumshopy-migrator:${{ github.sha }}#" k8s/40-migrate-job.yaml
          kubectl apply -f k8s/40-migrate-job.yaml
          kubectl -n premiumshopy wait --for=condition=complete job/db-migrate --timeout=300s
      - name: Rolling update
        run: |
          kubectl apply -f k8s/20-web.yaml
          kubectl -n premiumshopy rollout status deployment/web --timeout=300s
